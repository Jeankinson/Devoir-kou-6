<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Displaybox</title>

        <style>

           .Gallerie{
                display: flex;
                justify-content: space-around;
                gap: 10px;
                padding: 20px;
            }


            .kat{
                background-color: #ffff;
                padding: 15px;
                border-radius: 10px;
                text-align: center;
                box-shadow: 5px 5px 10px rgba(187, 27, 27, 0.1);
               
            }


             .kat img{
                display: flex;
                align-items: center;
                gap: 10px;
                border-color: blue;
                text-align: center;
            }

            .foto1{
                width: 100px;
                height: 100px;
                border-radius: 50px;
                object-fit: cover;               
                border-style: solid;
                align-items: center;
            }


        </style>
</head>
<body>

    <div class="Gallerie">

        <div class="kat">
            <img src="10.jpeg" alt="sa se yon foto 1" class="foto1">
            <h3>Premye foto</h3>
                <p><a href="#">Communication</a></p>
        </div>

        <div class="kat">
            <img src="13.jpg" alt="sa se yon foto 1" class="foto1">
            <h3>Dezyem foto</h3>
                <p><a href="#">Conférence et débat</a></p>
        </div>

        <div class="kat">
            <img src="12.jpeg" alt=" sa se yon foto 1" class="foto1">
            <h3>Twozyem foto</h3>
                <p><a href="#"> Marketing Digital</a></p>
        </div>





    </div>
    
</body>
</html>
